name: Production rollback

on:
  workflow_dispatch:
    inputs:
      deployment_url:
        description: Last known-good Vercel deployment URL to restore
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: production-rollback
  cancel-in-progress: false

jobs:
  rollback:
    name: Restore known-good production artifact
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Require the protected main branch
        if: github.ref != 'refs/heads/main'
        run: |
          echo "Production rollback is permitted only from main."
          exit 1

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify required Vercel credentials
        run: |
          test -n "$VERCEL_TOKEN"
          test -n "$VERCEL_ORG_ID"
          test -n "$VERCEL_PROJECT_ID"

      - name: Install pinned Vercel CLI
        run: npm install --global vercel@56.2.0

      - name: Link company production project
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Inspect rollback target
        run: vercel inspect "${{ inputs.deployment_url }}" --token="$VERCEL_TOKEN"

      - name: Restore known-good deployment
        run: vercel rollback "${{ inputs.deployment_url }}" --yes --token="$VERCEL_TOKEN"

      - name: Record rollback evidence
        run: vercel inspect "${{ inputs.deployment_url }}" --token="$VERCEL_TOKEN"
